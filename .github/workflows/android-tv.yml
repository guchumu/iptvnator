name: APK Android TV

# Builds a signed IPTVnator TV APK on GitHub (no local JDK/Android Studio).
# Actions → "APK Android TV" → Run workflow. Download the iptvnator.apk artifact.
#
# The APK loads https://acortador.vip/iptvnator/ — that URL must serve this
# PWA (same host pattern as StreamBox at /player/). Until it does, the app
# will not open.
#
# Public sideload URL (do not overwrite StreamBox downloads/tv.apk):
#   https://acortador.vip/iptvnator/downloads/iptvnator.apk

on:
  workflow_dispatch:
  push:
    tags:
      - "v*"
    branches:
      - master
      - main
    paths:
      - "native/**"
      - "tools/patch_android_tv.py"
      - "tools/make_tv_banner.py"
      - ".github/workflows/android-tv.yml"

permissions:
  contents: write

jobs:
  construir:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Node 20
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Install Capacitor
        working-directory: native
        run: npm install --no-audit --no-fund

      - name: Generate leanback banner
        run: python3 tools/make_tv_banner.py

      - name: Generate the Android project
        working-directory: native
        run: npx cap add android

      - name: Apply Android TV + native player patches
        run: python3 tools/patch_android_tv.py native/android

      - name: Stamp version
        id: ver
        working-directory: native/android/app
        run: |
          if [[ "${GITHUB_REF}" == refs/tags/v* ]]; then
            NAME="${GITHUB_REF_NAME#v}"
          else
            NAME="1.0.${{ github.run_number }}"
          fi
          echo "name=$NAME" >> "$GITHUB_OUTPUT"
          sed -i "s/versionCode 1$/versionCode ${{ github.run_number }}/" build.gradle
          sed -i "s/versionName \"1.0\"/versionName \"$NAME\"/" build.gradle
          grep -E "versionCode|versionName" build.gradle

      - name: Prepare signing key
        id: firma
        env:
          KEYSTORE_BASE64: ${{ secrets.IPTVNATOR_KEYSTORE_BASE64 || secrets.KEYSTORE_BASE64 }}
        run: |
          set -e
          RUTA="$RUNNER_TEMP/iptvnator.keystore"
          if [ -n "$KEYSTORE_BASE64" ]; then
            echo "$KEYSTORE_BASE64" | base64 -d > "$RUTA"
            echo "usando la clave guardada en los secretos"
            echo "generada=no" >> "$GITHUB_OUTPUT"
          else
            keytool -genkeypair -v -keystore "$RUTA" \
              -alias iptvnator -keyalg RSA -keysize 2048 -validity 10000 \
              -storepass iptvnator -keypass iptvnator \
              -dname "CN=IPTVnator, OU=Casa, O=IPTVnator, L=Madrid, C=ES"
            base64 -w0 "$RUTA" > "$RUNNER_TEMP/keystore-base64.txt"
            echo "clave nueva generada"
            echo "generada=si" >> "$GITHUB_OUTPUT"
          fi
          echo "ruta=$RUTA" >> "$GITHUB_OUTPUT"

      - name: Assemble signed release APK
        working-directory: native/android
        env:
          CLAVE: ${{ steps.firma.outputs.ruta }}
          CLAVE_PASS: ${{ secrets.IPTVNATOR_KEYSTORE_PASSWORD || secrets.KEYSTORE_PASSWORD || 'iptvnator' }}
          CLAVE_ALIAS: ${{ secrets.IPTVNATOR_KEY_ALIAS || secrets.KEY_ALIAS || 'iptvnator' }}
          CLAVE_ALIAS_PASS: ${{ secrets.IPTVNATOR_KEY_PASSWORD || secrets.KEY_PASSWORD || 'iptvnator' }}
        run: |
          chmod +x gradlew
          ./gradlew assembleRelease --no-daemon \
            -Pandroid.injected.signing.store.file="$CLAVE" \
            -Pandroid.injected.signing.store.password="$CLAVE_PASS" \
            -Pandroid.injected.signing.key.alias="$CLAVE_ALIAS" \
            -Pandroid.injected.signing.key.password="$CLAVE_ALIAS_PASS"

      - name: Copy to iptvnator.apk
        id: apk
        run: |
          set -e
          ORIGEN=native/android/app/build/outputs/apk/release/app-release.apk
          cp "$ORIGEN" iptvnator.apk
          DESTINO="iptvnator-tv-${{ steps.ver.outputs.name }}.apk"
          cp "$ORIGEN" "$DESTINO"
          ls -lh iptvnator.apk "$DESTINO"
          echo "nombre=$DESTINO" >> "$GITHUB_OUTPUT"
          AAPT=$(find "$ANDROID_HOME/build-tools" -name aapt2 | sort | tail -1)
          "$AAPT" dump badging iptvnator.apk | grep -Ei "leanback|banner|package:|sdkVersion" || true
          unzip -l iptvnator.apk | grep -Ei "exoplayer|media3|libvlc|VlcPlayer|PlayerActivity|StreamBoxPlugin" || true

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ steps.apk.outputs.nombre }}
          path: iptvnator.apk
          retention-days: 90

      - name: Upload new signing key (save as IPTVNATOR_KEYSTORE_BASE64)
        if: steps.firma.outputs.generada == 'si'
        uses: actions/upload-artifact@v4
        with:
          name: clave-de-firma-GUARDAR-COMO-SECRETO
          path: ${{ runner.temp }}/keystore-base64.txt
          retention-days: 7

      - name: Attach APK to GitHub Release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: iptvnator.apk
          body: |
            Sideload on Fire Stick with Downloader. Prefer the stable host URL
            once the PWA is deployed:

            **https://acortador.vip/iptvnator/downloads/iptvnator.apk**

            Do not use StreamBox's `downloads/tv.apk`. This APK opens
            https://acortador.vip/iptvnator/ — that path must serve the IPTVnator PWA.
